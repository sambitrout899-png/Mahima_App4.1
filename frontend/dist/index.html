<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#047857" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>Mahima Frontend</title>

    <!-- First-party font: preloaded locally so the shell never swaps between
         a Windows fallback and a late Google Fonts response. -->

    <style>
      html,body {
        font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        margin: 0;
        height: 100%;
      }
    </style>

    <!--
      Runtime Google auth override:
      - Set window.__GOOGLE_CLIENT_ID__ to your Web OAuth client ID.
      - For Android native plugin builds, optionally set window.__GOOGLE_ANDROID_CLIENT_ID__.
      - Backend must also include the same IDs under GoogleAuth:ClientIds or matching env vars.
    -->
    <script>
      window.__GOOGLE_CLIENT_ID__ = window.__GOOGLE_CLIENT_ID__ || "";
      window.__GOOGLE_ANDROID_CLIENT_ID__ = window.__GOOGLE_ANDROID_CLIENT_ID__ || "";
    </script>

    <!--
      Runtime API base override:
      - During local development this ensures frontend hits your backend at http://localhost:5001/api
      - If you want to override this in another environment, set window.__API_BASE__ before this file is loaded.
    -->
    <script>
      (function () {
        try {
          if (typeof window === "undefined" || window.__API_BASE__) return;

          // Detect the runtime so we never hand a relative URL to Capacitor
          // (where the WebView origin is https://localhost and "/api" is dead).
          var proto = (window.location && window.location.protocol) || "";
          var host  = (window.location && window.location.hostname) || "";
          var isCapacitor =
            proto === "capacitor:" ||
            (proto === "https:" && host === "localhost") ||
            (proto === "http:"  && host === "localhost" && !!window.Capacitor) ||
            !!(window.Capacitor && window.Capacitor.isNativePlatform && window.Capacitor.isNativePlatform());

          // Use the same host that .env.production / .env.mobile uses
          // to avoid certificate-SAN mismatches between www. and bare domain.
          window.__API_BASE__ = isCapacitor
            ? "https://beta.mahimaministries.in/api"
            : "/api";

          console.info("window.__API_BASE__ set to", window.__API_BASE__, "(capacitor:", isCapacitor + ")");
        } catch (e) {
          // noop
        }
      })();
    </script>
    <script type="module" crossorigin src="/assets/index-DY8tFIPa.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-D3o3XeD9.css">
  </head>

    <div id="root"></div>

    <!-- app entry -->
  </body>
</html>
